# ============================================================
# Layer 3 Graph — skill-curator 功能链（自动创建 & 生命周期管理）
# 格式：TOML（机器可解析）
# 粒度：功能级（feature + function）
# 说明：自动创建 = curator 触发 fork → LLM 评审 → skill_manage(action=create)
#       生命周期 = 自动 stale/archive/pin/consolidate
# 更新：2026-08-30
# ============================================================

[graph]
name = "Layer 3 Graph - skill-curator 功能链"
layer = 3
granularity = "功能级（feature + function）"
created = "2026-08-30"
note = "REALIZED_BY/CALLS 边均为扫描+确认的事实；LLM prompt 内容由 curator.py 内嵌字符串提供"

# ============================================================
# 功能节点
# ============================================================

[[nodes]]  # 节点 feature.skill-curator: 技能自动创建 & 生命周期管理
id = "feature.skill-curator"
kind = "feature"
desc = "技能自动创建与生命周期：curator 定时触发 → fork AIAgent → LLM 评审 → skill_manage(action=create/patch/delete) + 自动 stale/archive/consolidate"
note = "只管理 created_by='agent' 的技能；用户手动创建的技能不受 curator 影响"

# ============================================================
# 文件节点
# ============================================================

[[nodes]]  # 节点 file.tools.skill_manager_tool: 技能管理器（agent 自主创建/编辑/删除技能的唯一入口）
id = "file.tools.skill_manager_tool"
kind = "file"
path = "tools/skill_manager_tool.py"
layer = "core"
desc = "技能管理器：skill_manage(action=create/edit/patch/delete/write_file/remove_file)；是 agent 自主创建/编辑/删除技能的唯一工具"

[[nodes]]  # 节点 file.tools.skill_provenance: 写来源 ContextVar（区分 foreground vs background_review）
id = "file.tools.skill_provenance"
kind = "file"
path = "tools/skill_provenance.py"
layer = "core"
desc = "技能写来源：ContextVar 区分 foreground（用户触发）vs background_review（curator 触发）；只有后者才标记 created_by='agent'"

[[nodes]]  # 节点 file.tools.skill_usage: 技能遥测（usage.json，created_by 标记）
id = "file.tools.skill_usage"
kind = "file"
path = "tools/skill_usage.py"
layer = "core"
desc = "技能遥测：usage.json 侧car，记录 use_count/patch_count/created_by；mark_agent_created 将技能纳入 curator 管理范围"

[[nodes]]  # 节点 file.agent.curator: 策展人（自动转态 + LLM 评审 + fork 调度）
id = "file.agent.curator"
kind = "file"
path = "agent/curator.py"
layer = "core"
desc = "策展人：maybe_run_curator（触发判断）→ apply_automatic_transitions（确定性 stale/archive）→ run_curator_review（主入口）→ _run_llm_review（fork AIAgent 执行 LLM 评审）"

[[nodes]]  # 节点 file.cli: CLI 入口（启动时触发 curator）
id = "file.cli"
kind = "file"
path = "cli.py"
layer = "core"
desc = "CLI 入口：HermesCLI 启动时调用 maybe_run_curator(idle_for_seconds=inf)，触发 curator 首次评审"

[[nodes]]  # 节点 file.gateway.run: Gateway 运行时（定期触发 curator）
id = "file.gateway.run"
kind = "file"
path = "gateway/run.py"
layer = "core"
desc = "Gateway 运行时：agent idle 时定期调用 maybe_run_curator(idle_for_seconds=idle_time)，触发 curator 评审"

