# ============================================================
# Layer 3 Graph — skill-startup 功能链（hermes 入口 → 技能索引注入 system prompt）
# 格式：TOML（机器可解析）
# 粒度：功能级（feature + function）
# 说明：skill-load 图覆盖"运行时命令/载荷加载"侧（/skills 命令、_load_skill_payload），
#       本图覆盖"启动注入"侧：hermes 命令 → cmd_chat → cli.main → agent 初始化 →
#       system prompt 构建 → build_skills_system_prompt（技能索引三层缓存）→ 注入 stable 层。
#       启动侧的"加载"= 索引注入（技能名+描述+分类），SKILL.md 全文是运行时 skill_view 才读。
# 更新：2026-08-29
# 约定：file.* 节点跨文件引用 Layer-1/Layer-2（不重复定义）；
#       iter_skill_index_files 等节点跨文件引用 Layer-3-Graph-skill_load.toml
# ============================================================

