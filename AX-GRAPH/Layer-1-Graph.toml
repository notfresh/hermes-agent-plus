granularity = "源码级（模块 + 文件）"
created = "2026-08-28"
schema = "nodes: 实体; edges: CONTAINS(内聚) / DEPENDS_ON(耦合, weight=import次数)"
note = "核心发现：hermes_cli 被依赖970次为全库最大，是核心底座而非CLI薄壳；agent/tools/hermes_cli 三巨头强耦合"
