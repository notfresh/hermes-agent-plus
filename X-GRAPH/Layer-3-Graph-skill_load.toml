# 说明：功能是横切多个模块的（tools/ + agent/），第二层的 cluster 表达不了，
#       必须靠第三层：feature → REALIZED_BY → 文件::函数:行号
# 更新：2026-08-28
# ============================================================

[graph]
name = "Layer 3 Graph - skill-load 功能链"
layer = 3
granularity = "功能级（feature + function）"
created = "2026-08-28"
note = "REALIZED_BY 边均为扫描+确认的事实；函数级 CALLS 调用关系未实测，待补"

